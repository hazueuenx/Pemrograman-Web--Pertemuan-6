<!doctype html>
<html lang="en">

  <body>
    <nav class="navbar">
      <div class="navbar-links">

        <a href="2.html">Latihan 2</a>

    <section class="contact-form">
      <form>
        <div>
          <label for="nama">Nama:</label>
          <input type="text" id="nama" name="name" />
        </div>

        <div>
          <label for="nim">NIM:</label>
          <input type="text" id="nim" name="text" />
        </div>

        <div>
          <label for="mata_kuliah">Mata Kuliah:</label>
          <select name="mata_kuliah" id="mata_kuliah">
            <option value="null">Pilih Jurusan</option>
            <option value="Pemrograman Web">Pemrograman Web</option>
            <option value="Jaringan Komputer">Jaringan Komputer</option>
          </select>
        </div>

        <div>
          <label for="dosen">Dosen:</label>
          <select name="dosen" id="dosen">
            <option value="null">Pilih Jurusan</option>
            <option value="Fajar Baskoro">IPA</option>
            <option value="Dwi Sunarno">IPS</option>
          </select>
        </div>
        <button type="submit">Submit</button>
      </form>
    </section>
    <script src="js/script.js"></script>
  </body>
